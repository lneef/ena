[agents.inspector]
description = """
Reference-code researcher for amzn-drivers/ (DPDK ena PMD, ena_com, kernel
driver, defs headers). Use proactively whenever any question about ENA behavior,
register semantics, admin commands, descriptor formats, or driver flow arises.
Writes findings into docs/wiki/ and returns a reference.
"""
nickname_candidates = ["inspector", "ena-inspector", "ena inspector"]
config_file = "./agents/inspector.toml"

[agents.wiki_verifier]
description = """
Wiki verifier for information extracted from reference code at amzn-drivers/.
Use proactively after consulting the inspector to extend the wiki. Checks the
integrity of the provided scope and provides a short report without changing
wiki content.
"""
nickname_candidates = ["wiki_verifier", "wiki-verifier", "wiki verifier"]
config_file = "./agents/wiki_verifier.toml"
